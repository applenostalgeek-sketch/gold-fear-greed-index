name: Post Tweet

on:
  schedule:
    # Daily at 6:07 UTC (8:07 Paris in summer). Kept 4h after the index job.
    # Off the top of the hour on purpose: the :00 slot is the most contended
    # GitHub-wide, and this job has never once started on time (median lag
    # 1h42 over 201 runs). Both schedules silently failed to fire on 2026-08-27.
    - cron: '7 6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tweepy

      - name: Post tweet
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: python post_tweet.py
