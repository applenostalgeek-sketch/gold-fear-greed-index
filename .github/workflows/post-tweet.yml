name: Post Tweet

on:
  # Chained to the index job instead of a clock. The tweet reads the files that
  # job commits, so it must start after the push — which a second cron could
  # never promise: the old '7 6 * * *' schedule never once started before the
  # Netlify watchdog stepped in at 09:02 UTC (checked 2026-09-05 to 09-13), so
  # the backup had become the mechanism. For workflow_run, checkout gets the
  # latest commit on main, i.e. the data that run just pushed.
  #
  # ⚠️ This matches the index workflow by its NAME. Rename it there and this
  # trigger silently stops firing — only the watchdog would still tweet.
  workflow_run:
    workflows: ['Update Gold, Stocks, Crypto & Bonds Fear & Greed Indices']
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: 'Post even if a tweet already went out today'
        type: boolean
        default: false

# Two runs starting together would both look up "did a tweet go out today?" and
# both answer no. Queue them instead, so the second sees the first's result.
# Never cancel one mid-post: a cancelled run may already have hit the API.
concurrency:
  group: post-tweet
  cancel-in-progress: false

jobs:
  # One tweet per day, whoever fires it.
  #
  # On 2026-08-28 two went out: one at 11:49 UTC, then GitHub's own cron woke up
  # 12h late and posted again at 18:33. The Netlify watchdog already checks
  # before dispatching, but nothing could stop GitHub's scheduler from firing on
  # top of it — and a duplicate tweet is public and cannot be taken back.
  #
  # Unlike the index job, this one writes no file, so there is nothing to re-read
  # to know whether the day is done. It has to ask GitHub about its own past
  # runs instead. Only runs whose `tweet` job actually succeeded count: a run
  # that failed never tweeted, and neither did one whose jobs were skipped —
  # none of them may block a later attempt.
  guard:
    # A run chained to a failed index job has nothing fresh to read. The watchdog
    # re-dispatches the index at 09:02 UTC, and that run chains the tweet again.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Has a tweet already gone out today?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          FORCED: ${{ inputs.force }}
        run: |
          gh api "repos/$REPO/actions/workflows/post-tweet.yml/runs?per_page=50" > runs.json
          python3 - <<'PY'
          import datetime, json, os, subprocess, sys

          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          me = os.environ['RUN_ID']

          with open('runs.json') as f:
              runs = json.load(f).get('workflow_runs', [])

          # Exclude this very run: it is in the list already, still in progress.
          successful = [r for r in runs
                        if str(r.get('id')) != me
                        and str(r.get('created_at', '')).startswith(today)
                        and r.get('conclusion') == 'success']

          # A successful RUN is not a tweet. A run chained to a failed index job
          # skips both jobs and can still be marked successful, and so is a run
          # this guard stopped. Counting those would let a non-tweet own the day
          # and block the real one. Only a `tweet` job that actually ran counts —
          # including one where post_tweet.py found nothing new and stayed quiet.
          # If the jobs API fails, this step fails: no tweet beats a duplicate.
          def tweet_job_ran(run_id):
              out = subprocess.run(
                  ['gh', 'api', f"repos/{os.environ['REPO']}/actions/runs/{run_id}/jobs"],
                  capture_output=True, text=True, check=True).stdout
              return any(j.get('name') == 'tweet' and j.get('conclusion') == 'success'
                         for j in json.loads(out).get('jobs', []))

          earlier = [r for r in successful if tweet_job_ran(r['id'])]

          forced = os.environ.get('FORCED', '').lower() == 'true'
          run = forced or not earlier

          when = ', '.join(r['created_at'][11:16] + ' UTC' for r in earlier) or 'none'
          print(f"::notice::successful tweets today = {len(earlier)} ({when}), "
                f"forced = {forced} -> {'posting' if run else 'skipping'}",
                file=sys.stderr)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"should_run={'true' if run else 'false'}\n")
          PY

  tweet:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tweepy

      - name: Post tweet
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: python post_tweet.py
