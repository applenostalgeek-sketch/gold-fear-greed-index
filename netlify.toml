
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Last safety net for the daily index run, after the 04:07 Netlify trigger and
# GitHub's 04:37 backup cron. GitHub's scheduler dropped the job entirely on
# 2026-08-27 and 2026-08-28 after 210 consecutive successes, so this net
# deliberately lives here rather than in a second GitHub cron. 09:02 UTC is still
# ahead of the US open, so the data matches what the morning run would have
# produced. Reads the published site first, acts only when today is missing.
# Two passes, 25 min apart. The tweet job reads the data files the index job
# commits, so a single pass could only ever fix one of the two: the first repairs
# the index, the second finds the data live and releases the tweet. On a normal
# day both passes find everything current and do nothing.
[functions."watchdog"]
  schedule = "2,27 9 * * *"

# PRIMARY trigger of the daily index run since Nov 2026 (see trigger-index.js).
# GitHub's own cron (37 4, UTC) is the backup; the watchdog above is the last net.
# Netlify evaluates this in UTC: 04:07 UTC = 05:07 Paris in winter, 06:07 in summer.
[functions."trigger-index"]
  schedule = "7 4 * * *"

# One address per page. Netlify answers both /gold and /gold.html, and its
# "Pretty URLs" option (switched off in the site settings in Nov 2026) rewrote
# every internal link to the short form while the canonical tags and the sitemap
# said .html. Google ended up picking /crypto, /stocks and /bonds against their
# canonical, kept /gold.html for gold, and still showed /gold as a duplicate.
# Everything is .html now: the form gold.html already ranks under.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/gold"
  to = "/gold.html"
  status = 301
  force = true

[[redirects]]
  from = "/stocks"
  to = "/stocks.html"
  status = 301
  force = true

[[redirects]]
  from = "/crypto"
  to = "/crypto.html"
  status = 301
  force = true

[[redirects]]
  from = "/bonds"
  to = "/bonds.html"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301
  force = true

[[redirects]]
  from = "/what-is-fear-and-greed"
  to = "/what-is-fear-and-greed.html"
  status = 301
  force = true

[[redirects]]
  from = "/how-to-use-sentiment"
  to = "/how-to-use-sentiment.html"
  status = 301
  force = true

[[redirects]]
  from = "/gold-vs-stocks-sentiment"
  to = "/gold-vs-stocks-sentiment.html"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; img-src 'self' data:; frame-ancestors 'none'"

[[headers]]
  for = "/data/*"
  [headers.values]
    # Crawlable (robots.txt) so Google can render the pages that read it, but
    # never listed as search results of their own.
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=300"  # 5 minutes cache
    Content-Type = "application/json"
