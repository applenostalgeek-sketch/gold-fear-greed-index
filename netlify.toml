
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Independent safety net for the daily index run. GitHub's scheduler dropped the
# job entirely on 2026-08-27 and 2026-08-28 after 210 consecutive successes, so
# the backup deliberately lives here rather than in a second GitHub cron.
# 09:02 UTC = 7h after the intended 02:07, well past the usual 20min-3h lag, and
# still ahead of the US open so the data matches what the night run would have
# produced. Reads first, triggers only when today's entry is genuinely missing.
# Two passes, 25 min apart. The tweet job reads the data files the index job
# commits, so a single pass could only ever fix one of the two: the first repairs
# the index, the second finds the data live and releases the tweet. On a normal
# day both passes find everything current and do nothing.
[functions."watchdog"]
  schedule = "2,27 9 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; img-src 'self' data:; frame-ancestors 'none'"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"  # 5 minutes cache
    Content-Type = "application/json"
